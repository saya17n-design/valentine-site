<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .card {
      background: white;
      padding: 40px 60px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      position: relative;
      width: 300px;
      height: 300px;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .buttons {
      margin-top: 30px;
      position: relative;
      height: 100px;
    }

    .btn {
      padding: 12px 30px;
      border-radius: 30px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      position: absolute;
      user-select: none;
    }

    .yes {
      background: #ff4d88;
      color: white;
      left: 20%;
    }

    .no {
      background: #eee;
      color: #333;
      left: 55%;
    }

    .hint {
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🐱💗</div>
    <h1>Mahmetov, will you be my Valentine?</h1>

    <div class="buttons">
      <a href="yes.html" class="btn yes">Yes</a>
      <button class="btn no" id="noBtn">No</button>
    </div>

    <p class="hint">No is not an option 😈</p>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("mouseover", () => {
      const card = document.querySelector(".card");
      const cardRect = card.getBoundingClientRect();

      const maxX = cardRect.width - noBtn.offsetWidth;
      const maxY = cardRect.height - noBtn.offsetHeight;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
    });
  </script>
</body>
</html>
